[package]
name = "grantry"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
description = "OAuth 2.1 authorization server building blocks for Rust web apps and MCP servers"
repository = "https://github.com/factorial-io/grantry"
readme = "README.md"
keywords = ["oauth", "oauth2", "mcp", "authorization", "axum"]
categories = ["authentication", "web-programming"]

[features]
default = []
# A reqwest-backed `MetadataFetcher` with no egress policy of its own.
client-fetch = ["dep:reqwest"]
# axum routers for metadata, authorize, token and register.
axum = ["dep:axum"]
# `conformance`: checks of the `OAuthStore` contract for store crates' tests.
conformance = ["tokio/macros"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11", default-features = false }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sha2 = "0.10"

[[test]]
name = "memory_conformance"
required-features = ["conformance"]

[package.metadata.docs.rs]
all-features = true
