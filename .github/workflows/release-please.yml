name: Release-please

# Two phases, one job:
#   - On every push to main, release-please opens (or updates) one release PR
#     with the version bump in Cargo.toml and the CHANGELOG.md entries, derived
#     from conventional-commit prefixes.
#   - When that PR merges, it tags `vX.Y.Z`, creates the GitHub Release, and
#     the `publish` job publishes the crate to crates.io.
#
# `RELEASE_PLZ_TOKEN` is a fine-grained PAT (`contents: write`,
# `pull-requests: write`), as in flowdrop-rs: a PR or tag pushed with
# `GITHUB_TOKEN` triggers no workflows, so CI would never run on the release PR.
# `CARGO_REGISTRY_TOKEN` is a crates.io token scoped to publish `grantry`.
#
# The first release is pinned by `release-as` in release-please-config.json
# (0.1.0-rc.1). Remove `release-as` after it is out, or change it to cut 0.1.0.

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to crates.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
