name: Release-please

# Two phases, one job:
#   - On every push to main, release-please opens (or updates) one release PR
#     with the version bump in Cargo.toml and the CHANGELOG.md entries, derived
#     from conventional-commit prefixes.
#   - When that PR merges, it tags `vX.Y.Z`, creates the GitHub Release, and
#     the `publish` job publishes the crate to crates.io.
#
# grantry and grantry-redis release separately (tags `vX.Y.Z` and
# `grantry-redis-vX.Y.Z`). The cargo-workspace plugin bumps grantry-redis's
# grantry requirement when grantry moves, and publish runs grantry first, so
# a release of both finds the new grantry on crates.io.
#
# `RELEASE_PLZ_TOKEN` is a fine-grained PAT (`contents: write`,
# `pull-requests: write`), as in flowdrop-rs: a PR or tag pushed with
# `GITHUB_TOKEN` triggers no workflows, so CI would never run on the release PR.
# `CARGO_REGISTRY_TOKEN` is a crates.io token scoped to publish `grantry` and
# `grantry-redis` (publish-new for its first release).
#
# To cut a specific version (such as 0.1.0 after the rc), add
# `"release-as": "X.Y.Z"` to the package in release-please-config.json for
# one release, and remove it again afterwards.

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      grantry: ${{ steps.release.outputs['grantry--release_created'] }}
      grantry-redis: ${{ steps.release.outputs['grantry-redis--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to crates.io
    needs: release-please
    if: needs.release-please.outputs.grantry == 'true' || needs.release-please.outputs.grantry-redis == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: needs.release-please.outputs.grantry == 'true'
        run: cargo publish -p grantry --all-features
      - if: needs.release-please.outputs.grantry-redis == 'true'
        run: cargo publish -p grantry-redis
