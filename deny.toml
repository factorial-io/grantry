# cargo-deny: licences compatible with MPL-2.0 distribution, no known
# vulnerabilities, crates.io only.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Boost Software License (not Business Source): permissive, OSI-approved.
# xxhash-rust is a required dependency of redis, used by grantry-redis.
exceptions = [
    { crate = "xxhash-rust", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[graph]
all-features = true
