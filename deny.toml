# cargo-deny: licences compatible with MPL-2.0 distribution, no known
# vulnerabilities, crates.io only.

[advisories]
version = 2
yanked = "deny"
# Both sit in jsonwebtoken's `rust_crypto` asymmetric algorithms (RSA, ECDSA)
# and have no fixed release on the version line jsonwebtoken 10 pins.
# grantry's own signing (`Signer::hmac_base64`) is HMAC and never reaches
# them. A host that signs with RS*/ES* keys takes this on itself; revisit
# when jsonwebtoken moves to rsa 0.10 / elliptic-curve 0.14.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; RSA keys only, no fixed rsa 0.9" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via elliptic-curve; EC keys only, fix only in 0.7" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[graph]
all-features = true
