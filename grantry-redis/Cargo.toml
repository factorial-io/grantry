[package]
name = "grantry-redis"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
description = "A Redis / Valkey OAuthStore for grantry"
repository = "https://github.com/factorial-io/grantry"
readme = "README.md"
keywords = ["oauth", "oauth2", "redis", "mcp", "authorization"]
categories = ["authentication", "web-programming"]

[dependencies]
grantry = { version = "0.4", path = "../grantry" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
grantry = { version = "0.4", path = "../grantry", features = ["conformance"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
